repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  # Use local system binary for TFLint
  - repo: local
    hooks:
      - id: tflint
        name: TFLint
        description: Linter for Terraform
        entry: tflint
        language: system
        types: [terraform]

      - id: trivy-config
        name: Trivy IaC Security Scan
        entry: trivy fs --security-checks config --exit-code 1 .
        language: system
        pass_filenames: false
