repos:
  # Base File Hygiene & Secret Scanning
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1024']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Terraform / OpenTofu Quality, Linting & Validation
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint

  # Local System Scans (Trivy)
  - repo: local
    hooks:
      - id: trivy-fs
        name: trivy-fs-scanner
        entry: trivy fs --security-checks config,vuln .
        language: system
        pass_filenames: false
        stages: [pre-commit]
